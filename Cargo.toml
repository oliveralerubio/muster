[package]
name = "muster"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["env", "error-context", "help", "std", "suggestions", "usage"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1"
thiserror = "2"
ctrlc = "3.4"
toml = "1.1.8"
age = { version = "0.12", features = ["armor"] }
secrecy = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
