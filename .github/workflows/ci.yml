name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    if: vars.CI_RUNNER != '' && vars.CI_RUNNER != 'none'
    # CI_RUNNER is maintained by scripts/ci-runner-select.sh (omarchy if online,
    # else ubuntu-latest if hosted minutes work, else "none" = skip).
    # Unset or empty also skips: jobs only run when the selector has decided.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  install-script:
    name: scripts
    if: vars.CI_RUNNER != '' && vars.CI_RUNNER != 'none'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Test install.sh
        run: bash tests/test_install_script.sh

      - name: Test ci-runner-select.sh
        run: bash tests/test_ci_runner_select.sh

  gitleaks:
    name: gitleaks
    if: vars.CI_RUNNER != '' && vars.CI_RUNNER != 'none'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
