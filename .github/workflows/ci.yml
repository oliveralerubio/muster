name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # runner-up pool: fresh container per job (no docker daemon, no preinstalled
    # rust/jq/gh). The fork guard above is kept: this repository is public.
    runs-on: ci-docker
    steps:
      - uses: actions/checkout@v4

      - name: Install C toolchain (linker)
        run: |
          command -v cc >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends build-essential
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js (web asset tests run node)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  install-script:
    name: scripts
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-docker
    steps:
      - uses: actions/checkout@v4

      - name: Test install.sh
        run: bash tests/test_install_script.sh

  gitleaks:
    name: gitleaks
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-docker
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
