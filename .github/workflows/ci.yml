name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    # Self-hosted omarchy runner by default. Set the repo variable CI_RUNNER
    # (JSON array of labels, e.g. ["ubuntu-latest"]) to switch to hosted runners.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast-runner"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

  install-script:
    name: install.sh
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast-runner"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Test install.sh
        run: bash tests/test_install_script.sh

  gitleaks:
    name: gitleaks
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","fast-runner"]') }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
