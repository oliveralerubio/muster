name: Publish muster Cloud image

# Every green push to main (Cloud CI) builds one image tagged with the commit
# SHA, on a GitHub-hosted runner, and publishes it to GHCR. That is ALL this
# workflow does: nothing here can reach the production host. The host pulls:
# muster-cloud-autodeploy (a systemd timer on the VPS) polls the public GitHub
# API, and deploys the newest commit whose Cloud CI run is green and whose
# image exists. Guide: deploy/KAMAL.md. No repository secrets beyond
# GITHUB_TOKEN (to push the image); the app's secrets live in
# /etc/muster-cloud on the host and never reach GitHub.
#
# The GHCR package must be public (once, in the package settings) so the host
# can pull it without any credential.
#
# `workflow_dispatch` republishes the image of the tip of main (for example
# after a failed build). It only runs from main.

on:
  workflow_run:
    workflows: ["Cloud CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-muster-cloud-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/oliveralerubio/muster-cloud

jobs:
  image:
    name: build image
    if: >-
      github.repository == 'oliveralerubio/muster' && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Resolve the commit to deploy
        id: sha
        run: |
          set -eu
          case "$SHA" in
            *[!0-9a-f]* | '') echo "not a commit SHA: $SHA" >&2; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "not a 40-character SHA" >&2; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.sha.outputs.sha }}
          # Kamal refuses an image without the `service` label. The source
          # label links the GHCR package to this repository. The revision
          # label is checked by muster-cloud-autodeploy: the image must say it
          # was built from the commit its tag names.
          labels: |
            service=muster-cloud
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
