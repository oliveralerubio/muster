name: Cloud CI

# CI for the muster-cloud backend (workspace member `cloud`), kept separate
# from .github/workflows/ci.yml (which owns the OSS CLI gates and is not
# modified here).
#
# The ci-docker runner pool has no Docker daemon and no preinstalled
# Rust/PostgreSQL: this workflow installs what it needs with apt (guarded, so
# preexisting tooling is reused) and never touches a Docker daemon.
#
# PostgreSQL for tests is provisioned by deploy/pg-test.sh: an ephemeral,
# socket-only cluster created per run (initdb + pg_ctl), never a global PG
# service. When the runner user is root — initdb/pg_ctl refuse root — the
# launcher delegates only those two steps to the package-installed `postgres`
# account via runuser(1) while the test shell keeps its own user, leaving
# HOME and the rest of the environment untouched.
#
# Tests are never skipped for lack of PostgreSQL: if the cluster cannot be
# created, deploy/pg-test.sh exits non-zero (69/70/77) and this job fails.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_MAX_RETRIES: "10"
  # No debug info in CI builds. The self-hosted runners share one disk;
  # debug info dominates the size of the ~25 linked test binaries, and a
  # full disk made `ld` die with SIGBUS (signal 7) mid-link. Panic messages
  # still report file:line; only backtraces lose source locations.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  cloud:
    name: muster-cloud
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # runner-up pool: fresh container per job (no docker daemon, no
    # preinstalled rust/jq/gh). The fork guard above is kept: this repository
    # is public.
    runs-on: ci-docker
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (cc, git, age)
        run: |
          set -eu
          apt="apt-get"
          [ "$(id -u)" -eq 0 ] || apt="sudo apt-get"
          install=""
          command -v cc >/dev/null 2>&1 || install="$install build-essential"
          command -v git >/dev/null 2>&1 || install="$install git"
          # Backups are age-encrypted by default: deploy_restore and the
          # drill take that path (synthetic key pairs from age-keygen).
          command -v age-keygen >/dev/null 2>&1 || install="$install age"
          if [ -n "$install" ]; then
            $apt update
            $apt install -y --no-install-recommends $install
          fi

      - name: Install PostgreSQL server binaries (ephemeral clusters only, no service)
        run: |
          set -eu
          apt="apt-get"
          [ "$(id -u)" -eq 0 ] || apt="sudo apt-get"
          # deploy/pg-test.sh needs initdb/pg_ctl (server package) and finds
          # them via PATH or pg_config --bindir. Installing the server
          # package also creates the non-root `postgres` account the launcher
          # delegates to when the runner user is root. No PG service is
          # started, and the launcher never connects to any preexisting
          # instance anyway (socket-only cluster in its own private dir).
          have_pg=""
          command -v initdb >/dev/null 2>&1 && have_pg=1
          if [ -z "$have_pg" ] && command -v pg_config >/dev/null 2>&1 \
             && [ -x "$(pg_config --bindir)/initdb" ]; then
            have_pg=1
          fi
          if [ -z "$have_pg" ]; then
            $apt update
            $apt install -y --no-install-recommends postgresql libpq-dev postgresql-client
          fi

      # Fresh runner containers have no rustup. Install it here with retries:
      # a single transient network error in the toolchain action's own
      # download failed whole CI runs.
      - name: Install rustup (retried)
        run: |
          if ! command -v rustup >/dev/null && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            for attempt in 1 2 3 4 5; do
              if curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 5 \
                   --location --silent --show-error --fail https://sh.rustup.rs \
                   | sh -s -- --default-toolchain none --profile minimal -y; then
                break
              fi
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 10))
            done
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node.js (web asset tests run node)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser test dependencies
        working-directory: cloud/tests/browser
        run: |
          npm ci
          npx --no-install playwright-core install --with-deps chromium

      # Shared cargo target/ + registry cache for this job across runs.
      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2

      - name: Format (muster-cloud)
        run: cargo fmt -p muster-cloud -- --check

      - name: Clippy (muster-cloud)
        run: cargo clippy --locked -p muster-cloud --all-targets --all-features -- -D warnings

      # cli_cloud.rs drives the REAL CLI binary through MUSTER_CLI_BIN, so the
      # tests exercise the CLI as actually shipped from this same checkout.
      # Build it here and export the absolute path for the later step:
      # deploy/pg-test.sh passes the environment through to cargo test.
      # CARGO_TARGET_DIR wins when defined (Swatinem/rust-cache and local
      # builds may set it); otherwise the checkout's own target/ is used.
      - name: Build CLI (current, for cli_cloud)
        run: |
          set -eu
          cargo build --locked -p muster --bin muster
          target_dir="${CARGO_TARGET_DIR:-$PWD/target}"
          target_dir="$(cd "$target_dir" && pwd)"
          bin="$target_dir/debug/muster"
          test -x "$bin"
          echo "MUSTER_CLI_BIN=$bin" >> "$GITHUB_ENV"

      # Ephemeral PostgreSQL via deploy/pg-test.sh; the command's exit status
      # is preserved, so any failure (including a missing cluster) is red.
      # Migrations are the caller's choice: cloud tests run sqlx migrations
      # themselves against MUSTER_TEST_PG (the launcher never invents SQL).
      - name: Tests (ephemeral PostgreSQL, socket-only)
        run: |
          resource_snapshot() {
            disk() {
              local label="$1" path="$2" kind result
              case "$path" in /*) ;; *) path="$PWD/$path" ;; esac
              while [ ! -e "$path" ] && [ "$path" != / ]; do
                path="${path%/*}"
                [ -n "$path" ] || path=/
              done
              for kind in blocks inodes; do
                if [ "$kind" = blocks ]; then
                  result=$(df -Pk -- "$path" 2>/dev/null | awk 'NR == 2 && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ && length($2) <= 20 && length($3) <= 20 && length($4) <= 20 {print $2, $3, $4}') || result=""
                else
                  result=$(df -Pi -- "$path" 2>/dev/null | awk 'NR == 2 && $2 ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ && length($2) <= 20 && length($3) <= 20 && length($4) <= 20 {print $2, $3, $4}') || result=""
                fi
                printf 'disk_%s_%s_total_used_available %s\n' "$label" "$kind" "${result:-unavailable}"
              done
            }
            disk workspace "$PWD"
            disk target "${CARGO_TARGET_DIR:-target}"
            disk tmp "${TMPDIR:-/tmp}"
            disk devshm /dev/shm
            awk '$1 ~ /^(MemTotal|MemAvailable|SwapTotal|SwapFree):$/ && $2 ~ /^[0-9]+$/ && length($2) <= 20 && !seen[$1]++ {gsub(":", "", $1); print "meminfo_" $1 "_kib " $2}' /proc/meminfo 2>/dev/null || :
            for limit in n u v f c; do
              value=$(ulimit -"$limit" 2>/dev/null) || value=unavailable
              case "$value" in ''|*[!0-9]*) [ "$value" = unlimited ] || value=unavailable ;; esac
              [ "${#value}" -le 20 ] || value=unavailable
              printf 'process_limit_%s %s\n' "$limit" "$value"
            done

            # Resolve membership against the mount root; a cgroup mount can
            # expose a subtree instead of the hierarchy root.
            local version membership resolved file value key
            resolved=""
            for version in 2 1; do
              membership=$(awk -F: -v v="$version" 'v == 2 && $1 == "0" && $2 == "" {print $3; exit} v == 1 && ("," $2 ",") ~ /,memory,/ {print $3; exit}' /proc/self/cgroup 2>/dev/null) || membership=""
              [ -n "$membership" ] || continue
              resolved=$(awk -v v="$version" -v member="$membership" '
                function decode(s) {gsub(/\\040/, " ", s); gsub(/\\011/, "\t", s); gsub(/\\012/, "\n", s); gsub(/\\134/, "\\", s); return s}
                { for (i = 7; i <= NF && $i != "-"; i++); if (i >= NF) next
                  if (v == 2 && $(i+1) != "cgroup2") next
                  if (v == 1 && ($(i+1) != "cgroup" || ("," $(i+3) ",") !~ /,memory,/)) next
                  root = decode($4); mount = decode($5)
                  if (root == "/") suffix = member
                  else if (member == root) suffix = ""
                  else if (index(member, root "/") == 1) suffix = substr(member, length(root)+1)
                  else next
                  if (length(root) > best) {best = length(root); result = mount suffix}
                }
                END {if (best) print result}' /proc/self/mountinfo 2>/dev/null) || resolved=""
              [ -n "$resolved" ] && break
            done
            if [ -z "$resolved" ] || [ ! -d "$resolved" ]; then
              printf 'cgroup unavailable\n'
              return 0
            fi
            printf 'cgroup_version %s\n' "$version"
            if [ "$version" = 2 ]; then
              for file in memory.current memory.peak memory.max memory.swap.current memory.swap.max; do
                value=$(cat "$resolved/$file" 2>/dev/null) || value=unavailable
                case "$value" in ''|*[!0-9]*) [ "$value" = max ] || value=unavailable ;; esac
                [ "${#value}" -le 20 ] || value=unavailable
                printf 'cgroup_%s %s\n' "$file" "$value"
              done
              awk '$1 ~ /^(low|high|max|oom|oom_kill|oom_group_kill)$/ && $2 ~ /^[0-9]+$/ && length($2) <= 20 && !seen[$1]++ {print "cgroup_event_" $1 " " $2}' "$resolved/memory.events" 2>/dev/null || :
            else
              for file in memory.usage_in_bytes memory.max_usage_in_bytes memory.limit_in_bytes memory.failcnt memory.memsw.usage_in_bytes memory.memsw.limit_in_bytes; do
                value=$(cat "$resolved/$file" 2>/dev/null) || value=unavailable
                case "$value" in ''|*[!0-9]*) value=unavailable ;; esac
                [ "${#value}" -le 20 ] || value=unavailable
                printf 'cgroup_%s %s\n' "$file" "$value"
              done
            fi
          }
          before=$(resource_snapshot 2>/dev/null) || before=unavailable
          if deploy/pg-test.sh -- cargo test --locked -p muster-cloud --tests; then
            status=0
          else
            status=$?
            after=$(resource_snapshot 2>/dev/null) || after=unavailable
            printf 'resource_before\n%s\nresource_after\n%s\n' "$before" "$after" >&2 || :
          fi
          exit "$status"

      # Uses the muster-cloud-ops just built; skips itself without a user namespace.
      - name: Host ops binary never goes back to an older release
        run: deploy/tests/install-ops.sh

  # The host deploy scripts (deploy/kamal) tested against a fake docker, curl,
  # Kamal and alert command: no Docker daemon, root or network needed.
  deploy-scripts:
    name: deploy scripts
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-docker
    steps:
      - uses: actions/checkout@v4

      - name: Install tools (git, python3, flock, age)
        run: |
          set -eu
          apt="apt-get"
          [ "$(id -u)" -eq 0 ] || apt="sudo apt-get"
          install=""
          command -v git >/dev/null 2>&1 || install="$install git"
          command -v python3 >/dev/null 2>&1 || install="$install python3"
          command -v flock >/dev/null 2>&1 || install="$install util-linux"
          # The offsite, authority-copy and drill tests encrypt with real keys.
          command -v age-keygen >/dev/null 2>&1 || install="$install age"
          if [ -n "$install" ]; then
            $apt update
            $apt install -y --no-install-recommends $install
          fi

      - name: Syntax of the deploy scripts
        run: |
          set -eu
          for f in bin/kamal deploy/kamal/muster-cloud-autodeploy deploy/kamal/host-setup.sh \
                   deploy/kamal/muster-cloud-offsite deploy/kamal/muster-cloud-authority-offsite \
                   deploy/kamal/muster-cloud-backup-check deploy/kamal/muster-cloud-restore-drill \
                   deploy/kamal/muster-cloud-install-ops deploy/tests/install-ops.sh \
                   deploy/pg-restore.sh deploy/tests/restore-owner.sh \
                   deploy/tests/autodeploy-guard.sh deploy/tests/offsite.sh \
                   deploy/tests/authority-offsite.sh \
                   deploy/tests/restore-drill.sh deploy/tests/backup-check-units.sh; do
            bash -n "$f"
          done

      - name: Autodeploy tests (guard, proxy and database bootstrap, incomplete deploys)
        run: deploy/tests/autodeploy-guard.sh

      - name: Offsite tests (never purge the last complete snapshot)
        run: deploy/tests/offsite.sh

      - name: Authority copy tests (every recipient decrypts, copies again when the journal grows)
        run: deploy/tests/authority-offsite.sh

      - name: Restore runs ops as the owner of the authority (user namespace; skipped when unavailable)
        run: deploy/tests/restore-owner.sh

      - name: Restore drill selection and backup-check tests
        run: |
          set -eu
          deploy/tests/restore-drill.sh
          deploy/tests/backup-check-units.sh

  backup-drill:
    name: backup-drill
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-docker
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (cc, git, curl, age)
        run: |
          set -eu
          apt="apt-get"
          [ "$(id -u)" -eq 0 ] || apt="sudo apt-get"
          install=""
          command -v cc >/dev/null 2>&1 || install="$install build-essential"
          command -v git >/dev/null 2>&1 || install="$install git"
          command -v curl >/dev/null 2>&1 || install="$install curl"
          # The drill backs up encrypted (synthetic age key pair).
          command -v age-keygen >/dev/null 2>&1 || install="$install age"
          # It reads the restore's JSON (incarnation, residue).
          command -v jq >/dev/null 2>&1 || install="$install jq"
          if [ -n "$install" ]; then
            $apt update
            $apt install -y --no-install-recommends $install
          fi

      - name: Install PostgreSQL server binaries (ephemeral clusters only, no service)
        run: |
          set -eu
          apt="apt-get"
          [ "$(id -u)" -eq 0 ] || apt="sudo apt-get"
          have_pg=""
          command -v initdb >/dev/null 2>&1 && have_pg=1
          if [ -z "$have_pg" ] && command -v pg_config >/dev/null 2>&1 \
             && [ -x "$(pg_config --bindir)/initdb" ]; then
            have_pg=1
          fi
          if [ -z "$have_pg" ]; then
            $apt update
            $apt install -y --no-install-recommends postgresql libpq-dev postgresql-client
          fi

      # Fresh runner containers have no rustup. Install it here with retries:
      # a single transient network error in the toolchain action's own
      # download failed whole CI runs.
      - name: Install rustup (retried)
        run: |
          if ! command -v rustup >/dev/null && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            for attempt in 1 2 3 4 5; do
              if curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 5 \
                   --location --silent --show-error --fail https://sh.rustup.rs \
                   | sh -s -- --default-toolchain none --profile minimal -y; then
                break
              fi
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 10))
            done
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo target
        uses: Swatinem/rust-cache@v2
        with:
          # Separate key from the test job: the drill only needs two artifacts.
          cache-targets: false

      # The drill creates the lifecycle authority with the real ops binary
      # (explicit init) and pg-restore.sh gates restores through it.
      - name: Build service and ops binaries for the drill
        run: |
          set -eu
          cargo build --locked -p muster-cloud --bin muster-cloud --bin muster-cloud-ops
          test -x "${CARGO_TARGET_DIR:-target}/debug/muster-cloud"
          test -x "${CARGO_TARGET_DIR:-target}/debug/muster-cloud-ops"

      # The drill composes deploy/pg-test.sh (ephemeral socket-only cluster),
      # deploy/pg-backup.sh, deploy/pg-restore.sh and the optional Cargo-built
      # drill helper. Its exit status decides the step.
      - name: Backup/restore drill
        run: deploy/backup-drill.sh

      # The production image must carry the ops binary. No Docker daemon on
      # this pool: build the release artifacts the Dockerfile copies, and
      # require the Dockerfile to stub, build and copy the ops binary.
      - name: Release build ships service and ops binaries
        run: |
          set -eu
          cargo build --release --locked -p muster-cloud --bin muster-cloud --bin muster-cloud-ops
          test -x "${CARGO_TARGET_DIR:-target}/release/muster-cloud"
          test -x "${CARGO_TARGET_DIR:-target}/release/muster-cloud-ops"
          grep -qF '> cloud/src/ops.rs' deploy/Dockerfile
          grep -qF -- '--bin muster-cloud-ops' deploy/Dockerfile
          grep -qF 'COPY --from=build /usr/local/bin/muster-cloud-ops' deploy/Dockerfile
