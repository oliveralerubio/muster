name: Bootstrap image (temporary, removed before merge)

# One-off: publishes the first muster-cloud image from this branch so the very
# first Kamal deploy can run before deploy.yml exists on main. Deleted in the
# last commit of this PR.

on:
  push:
    branches: [feat/kamal-deploy]

permissions:
  contents: read

jobs:
  image:
    if: github.repository == 'oliveralerubio/muster'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/oliveralerubio/muster-cloud:${{ github.sha }}
          labels: |
            service=muster-cloud
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
